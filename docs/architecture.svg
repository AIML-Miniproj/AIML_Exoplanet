<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="1400" height="1020" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Exoplanet Atlas: system architecture</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070D"/><stop offset="1" stop-color="#0A1226"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0.28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#00CBE6" stop-opacity="0.16"/><stop offset="1" stop-color="#00CBE6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1424"/><stop offset="1" stop-color="#090D17"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121A2E"/><stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4D9FFF"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#54D8E8"/>
    </marker>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#EFBF62"/>
    </marker>
    <style>
      .h { fill: #F2F5FA; font-size: 30px; font-weight: 300; letter-spacing: 7px; }
      .sub { fill: #9AA8BA; font-size: 14px; letter-spacing: 1px; }
      .lt { font-size: 12px; font-weight: 700; letter-spacing: 3px; }
      .ct { fill: #F2F5FA; font-size: 15px; font-weight: 600; }
      .cs { fill: #9AA8BA; font-size: 12px; }
      .mono { font-family: Menlo, Consolas, monospace; fill: #54D8E8; font-size: 11.5px; }
      .tag { fill: #C3C9D6; font-size: 11.5px; }
    </style>
  </defs>

  <rect width="1400" height="1020" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="1020" rx="28" fill="url(#glowA)"/>
  <rect width="1400" height="1020" rx="28" fill="url(#glowB)"/>
  <rect x="1" y="1" width="1398" height="1018" rx="27" fill="none" stroke="#1A2333"/>

  <!-- Title -->
  <text x="60" y="70" class="h">EXOPLANET <tspan fill="#5DE6FF">ATLAS</tspan></text>
  <text x="60" y="98" class="sub">System architecture: from the browser to NASA's archives</text>

  <!-- ── Layer 1: Client ───────────────────────────── -->
  <rect x="60" y="125" width="1280" height="70" rx="20" fill="url(#layer)" stroke="#202A38"/>
  <text x="84" y="150" class="lt" fill="#9AA8BA">CLIENT</text>
  <rect x="520" y="140" width="360" height="42" rx="21" fill="#2563EB" opacity="0.95"/>
  <text x="700" y="167" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Web browser  ·  any device</text>
  <path d="M700 182 L700 222" stroke="#4D9FFF" stroke-width="2" marker-end="url(#arr)"/>
  <text x="712" y="207" class="cs">HTTP · ?page=home | learn | analyzer | demo_stars | how_it_works</text>

  <!-- ── Layer 2: Presentation ─────────────────────── -->
  <rect x="60" y="225" width="1280" height="235" rx="22" fill="url(#layer)" stroke="#202A38"/>
  <text x="84" y="252" class="lt" fill="#5DE6FF">PRESENTATION  ·  STREAMLIT</text>

  <rect x="90" y="270" width="250" height="170" rx="18" fill="url(#card)" stroke="#2563EB" stroke-opacity="0.6"/>
  <text x="112" y="300" class="ct">Page router</text>
  <text x="112" y="320" class="mono">app.py</text>
  <text x="112" y="348" class="cs">reads ?page= / ?star=</text>
  <text x="112" y="368" class="cs">keeps page state</text>
  <text x="112" y="388" class="cs">serves static/ images</text>
  <text x="112" y="416" class="tag">Streamlit 1.56</text>

  <rect x="370" y="270" width="440" height="170" rx="18" fill="url(#card)" stroke="#54D8E8" stroke-opacity="0.5"/>
  <text x="392" y="300" class="ct">Exoplanet Atlas pages (Google Stitch design)</text>
  <text x="392" y="320" class="mono">ui/stitch_pages.py  ·  ui/stitch/*.html</text>
  <g font-size="12.5" fill="#DDE2F5">
    <rect x="392" y="338" width="90" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="437" y="358" text-anchor="middle">Home</text>
    <rect x="490" y="338" width="90" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="535" y="358" text-anchor="middle">Learn</text>
    <rect x="588" y="338" width="110" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="643" y="358" text-anchor="middle">Demo Stars</text>
    <rect x="392" y="376" width="130" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="457" y="396" text-anchor="middle">How It Works</text>
  </g>
  <text x="392" y="426" class="cs">Tailwind HTML in a full-width frame · links wired to app pages</text>

  <rect x="840" y="270" width="470" height="170" rx="18" fill="url(#card)" stroke="#EFBF62" stroke-opacity="0.5"/>
  <text x="862" y="300" class="ct">Analyzer</text>
  <text x="940" y="300" class="cs">sidebar star picker + 4 tabs</text>
  <g font-size="12.5" fill="#DDE2F5">
    <rect x="862" y="316" width="104" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="914" y="336" text-anchor="middle">Light Curves</text>
    <rect x="974" y="316" width="104" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1026" y="336" text-anchor="middle">BLS</text>
    <rect x="1086" y="316" width="110" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1141" y="336" text-anchor="middle">Phase-Folded</text>
    <rect x="1204" y="316" width="86" height="30" rx="15" fill="#2563EB"/><text x="1247" y="336" text-anchor="middle" fill="#FFF">Results</text>
  </g>
  <text x="862" y="372" class="mono">ui/theme.py · ui/plots.py · ui/views.py · ui/explain.py</text>
  <text x="862" y="396" class="cs">verdict card · class probabilities · "Why?" (physics + SHAP)</text>
  <text x="862" y="416" class="cs">catalog check · findings · confusion matrix · feature importance</text>

  <!-- arrows down -->
  <path d="M1075 440 L1075 500" stroke="#4D9FFF" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1087" y="470" class="cs">live run: analyze_target()</text>
  <path d="M60 410 L34 410 L34 860 L54 860" stroke="#54D8E8" stroke-width="1.6" stroke-dasharray="5 5" fill="none" marker-end="url(#arrC)"/>
  <text x="26" y="640" class="cs" fill="#54D8E8" transform="rotate(-90 26 640)" text-anchor="middle">instant mode: reads precomputed reports + saved evaluation</text>

  <!-- ── Layer 3: Pipeline core ────────────────────── -->
  <rect x="60" y="505" width="1280" height="250" rx="22" fill="url(#layer)" stroke="#202A38"/>
  <text x="84" y="532" class="lt" fill="#4D9FFF">PIPELINE CORE  ·  src/pipeline.py → analyze_target()</text>

  <g>
    <rect x="90"  y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="108" y="580" class="ct">1 · Ingest</text><text x="108" y="600" class="mono">src/ingest/</text>
    <text x="108" y="622" class="cs">resolve TIC · download</text><text x="108" y="640" class="cs">sectors · Parquet cache</text>

    <rect x="270" y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="288" y="580" class="ct">2 · Preprocess</text><text x="288" y="600" class="mono">src/preprocess/</text>
    <text x="288" y="622" class="cs">upper-side clip · biweight</text><text x="288" y="640" class="cs">detrend · stitch sectors</text>

    <rect x="450" y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="468" y="580" class="ct">3 · Detect</text><text x="468" y="600" class="mono">src/detect/</text>
    <text x="468" y="622" class="cs">BLS 0.5–30 d · SDE ≥ 7</text><text x="468" y="640" class="cs">prewhitening · opt. TLS</text>

    <rect x="630" y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="648" y="580" class="ct">4 · Vetting</text><text x="648" y="600" class="mono">src/vetting/</text>
    <text x="648" y="622" class="cs">56 features: shape, odd/</text><text x="648" y="640" class="cs">even, sectors, variability</text>

    <rect x="810" y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="828" y="580" class="ct">5 · Triage</text><text x="828" y="600" class="mono">src/triage/</text>
    <text x="828" y="622" class="cs">XGBoost 4 classes</text><text x="828" y="640" class="cs">Platt calibration · SHAP</text>

    <rect x="990" y="552" width="168" height="110" rx="16" fill="url(#card)" stroke="#EFBF62" stroke-opacity="0.6"/>
    <text x="1008" y="580" class="ct">6 · Router</text><text x="1008" y="600" class="mono">src/recycler/router</text>
    <text x="1008" y="622" class="cs">size &gt; 2.5 R_J · 2nd</text><text x="1008" y="640" class="cs">eclipse · 50% → review</text>

    <rect x="1170" y="552" width="150" height="110" rx="16" fill="url(#card)" stroke="#202A38"/>
    <text x="1188" y="580" class="ct">7 · Recycle</text><text x="1188" y="600" class="mono">src/recycler/</text>
    <text x="1188" y="622" class="cs">planet · EB · variable</text><text x="1188" y="640" class="cs">noise log · report</text>
  </g>
  <g stroke="#4D9FFF" stroke-width="2" marker-end="url(#arr)">
    <path d="M258 607 L268 607"/><path d="M438 607 L448 607"/><path d="M618 607 L628 607"/>
    <path d="M798 607 L808 607"/><path d="M978 607 L988 607"/><path d="M1158 607 L1168 607"/>
  </g>
  <rect x="90" y="680" width="1230" height="52" rx="14" fill="#0F1626" stroke="#202A38"/>
  <text x="110" y="712" class="cs">Output: one structured report per star  ·  verdict + confidence  ·  probabilities  ·  plain-English reasons  ·  physical parameters with Monte-Carlo errors  ·  plot data</text>

  <!-- ── Layer 4: Data, models, external ───────────── -->
  <rect x="60" y="775" width="830" height="160" rx="22" fill="url(#layer)" stroke="#202A38"/>
  <text x="84" y="802" class="lt" fill="#A78BFA">MODELS &amp; DATA  (in the repo)</text>
  <rect x="90" y="818" width="250" height="96" rx="16" fill="url(#card)" stroke="#202A38"/>
  <text x="110" y="846" class="ct">Demo reports</text><text x="110" y="866" class="mono">data/examples/</text><text x="110" y="890" class="cs">6 stars, opened instantly</text>
  <rect x="360" y="818" width="250" height="96" rx="16" fill="url(#card)" stroke="#202A38"/>
  <text x="380" y="846" class="ct">Trained model</text><text x="380" y="866" class="mono">models/triage_*.json</text><text x="380" y="890" class="cs">XGBoost + calibration + meta</text>
  <rect x="630" y="818" width="240" height="96" rx="16" fill="url(#card)" stroke="#202A38"/>
  <text x="650" y="846" class="ct">Evaluation</text><text x="650" y="866" class="mono">model_evaluation.json</text><text x="650" y="890" class="cs">5-fold CV scores, confusion</text>

  <rect x="910" y="775" width="430" height="160" rx="22" fill="url(#layer)" stroke="#202A38"/>
  <text x="934" y="802" class="lt" fill="#EFBF62">EXTERNAL ARCHIVES</text>
  <g font-size="12.5" fill="#DDE2F5">
    <rect x="934" y="818" width="190" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1029" y="838" text-anchor="middle">NASA MAST · TESS</text>
    <rect x="1132" y="818" width="190" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1227" y="838" text-anchor="middle">TESS Input Catalog</text>
    <rect x="934" y="856" width="190" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1029" y="876" text-anchor="middle">NASA Exoplanet Archive</text>
    <rect x="1132" y="856" width="190" height="30" rx="15" fill="#0F1626" stroke="#202A38"/><text x="1227" y="876" text-anchor="middle">TESS EB catalog · Gaia</text>
  </g>
  <text x="934" y="914" class="cs">lightkurve · astroquery · requests (cached locally)</text>
  <path d="M1125 775 L1125 760" stroke="#EFBF62" stroke-width="2" marker-end="url(#arrA)"/>
  <path d="M485 775 L485 760" stroke="#A78BFA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── Footer strip: offline + DevOps ────────────── -->
  <rect x="60" y="952" width="1280" height="46" rx="16" fill="#0F1626" stroke="#202A38"/>
  <text x="84" y="981" class="tag"><tspan fill="#5DE6FF" font-weight="600">Offline training</tspan>  build_labels → select_stars → build_features → train_triage → build_examples → save_evaluation   <tspan fill="#5DE6FF" font-weight="600">   DevOps</tspan>  GitHub Actions CI (ruff + 148 tests) · Docker · Streamlit Community Cloud</text>
</svg>
