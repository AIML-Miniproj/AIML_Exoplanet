# Dark "deep space" theme. Extra styling (starfield, fonts, glass cards) is one CSS
# block in ui/theme.py. Class colours live in ui/theme.py and always carry a text label.
[theme]
base = "dark"
primaryColor = "#2563EB"
backgroundColor = "#02040A"
secondaryBackgroundColor = "#0B1530"
textColor = "#E2E8F0"
font = "sans serif"

[server]
# Serves static/ (images on the explainer pages) at app/static/.
enableStaticServing = true

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
