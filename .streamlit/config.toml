# Dark "deep space" theme. Extra styling (starfield, fonts, glass cards) is one CSS
# block in ui/theme.py. Class colours live in ui/theme.py and always carry a text label.
[theme]
base = "dark"
primaryColor = "#7C5CFF"
backgroundColor = "#05060F"
secondaryBackgroundColor = "#0D1026"
textColor = "#E6E9FF"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[browser]
gatherUsageStats = false
