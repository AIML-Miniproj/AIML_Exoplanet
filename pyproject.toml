[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' -p no:cacheprovider"
markers = [
    "network: needs internet access (MAST, NASA Exoplanet Archive, Gaia); run with -m network",
    "slow: takes more than a few seconds",
]
filterwarnings = [
    "ignore:.*tpfmodel submodule is not available.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", "data", "models", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
"ui/theme.py" = ["E501"]          # long CSS lines inside the style string
"ui/stitch_pages.py" = ["E501"]   # same, for the Stitch page CSS
